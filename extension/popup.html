<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CTI DS-160 Autofill</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png">
<style>
  :root { color-scheme: light dark; }
  body { width: 360px; margin: 0; padding: 12px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0; }
  /* The logo carries its own dark ground, so no plate behind it - just the
     matching corner radius and a fixed box, so a slow load cannot shift the
     title beside it. */
  .brand { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .brand img { width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto; }
  .who { background: #f3f4f6; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  /* The visa class, first thing in the applicant box. Deliberately loud: it
     is the only thing on screen that says which side of the app this record
     came from, and a C1/D record on a J1 application fills the cruise line's
     details into boxes that accept them without complaint. */
  .cls { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
         text-transform: uppercase; border-radius: 4px; padding: 2px 6px; margin-bottom: 6px; }
  .cls.c1d { background: #dbeafe; color: #1e3a8a; }
  .cls.j1  { background: #dcfce7; color: #14532d; }
  .cls.unknown { background: #fef2f2; color: #b91c1c; text-transform: none; letter-spacing: 0; }
  .who b { display: block; font-size: 14px; }
  /* BLOCK, not inline. showWho() writes two spans - the passport/DOB/cruise
     line, then "sent <time>" - and inline they ran together as
     "Cunard Linesent 1:31:12 PM". The <b> above is already block; these
     were meant to stack the same way. */
  .who span { display: block; color: #6b7280; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #d1d5db;
           background: #fff; cursor: pointer; }
  button.primary { background: #B01A18; border-color: #B01A18; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  label.chk { font-size: 12px; color: #4b5563; display: flex; align-items: center; gap: 4px; }
  #report { font-size: 12px; max-height: 220px; overflow: auto; border-top: 1px solid #e5e7eb;
            padding-top: 8px; }
  .authbox { font-size: 11.5px; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  .authbox.ok    { color: #15803d; }
  .authbox.grace { background: #fffbeb; border: 1px solid #b45309; color: #b45309; }
  .authbox.deny  { background: #fef2f2; border: 1px solid #b91c1c; color: #b91c1c; }
  #report ul { margin: 2px 0 8px; padding-left: 16px; }
  .ok { color: #15803d; } .warn { color: #b45309; } .err { color: #b91c1c; }
  .stale { background: #fef2f2; border: 1px solid #b91c1c; color: #b91c1c;
           border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: 11.5px; }
  /* Not an error: these fields have no column in the intake form and never
     will be filled. Red would train the agent to ignore the real banner. */
  .note { background: #f1f5f9; border: 1px solid #94a3b8; color: #334155;
          border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: 11.5px; }
  @media (prefers-color-scheme: dark) { .note { background: #1e293b; color: #cbd5e1; } }
  .sweep { background: #fffbeb; border: 1px solid #f59e0b; color: #92400e;
           border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; }
  .sweep ul { margin: 5px 0 0; padding-left: 16px; }
  @media (prefers-color-scheme: dark) { .sweep { background: #2a2312; color: #fbbf24; } }
  textarea { width: 100%; box-sizing: border-box; height: 60px; font: 11px/1.3 ui-monospace, monospace; }
  details { margin-top: 8px; font-size: 12px; }
  .teach { display: flex; gap: 4px; margin: 3px 0; align-items: center; }
  .teach code { flex: 1; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select { font: 11px system-ui; max-width: 130px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    .who { background: #1f2937; } .who span { color: #9ca3af; }
    .cls.c1d { background: #1e3a8a; color: #dbeafe; }
    .cls.j1  { background: #14532d; color: #dcfce7; }
    .cls.unknown { background: #7f1d1d; color: #fee2e2; }
    button { background: #1f2937; color: #e5e7eb; border-color: #374151; }
    button.primary { background: #B01A18; border-color: #B01A18; }
    #report { border-color: #374151; }
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/logo-32.png" width="24" height="24" alt="">
    <h1>CTI DS-160 Autofill</h1>
  </div>
  <div class="who" id="who">No applicant loaded.</div>
  <!-- The sign-in gate's verdict. Hidden while it is still being checked,
       so the popup never flashes a wrong state. -->
  <div id="auth" class="authbox" hidden></div>
  <!-- Why Fill is briefly unavailable. Says the reason, not just "wait". -->
  <div id="cooldown" class="authbox grace" hidden></div>

  <div class="row">
    <button class="primary" id="fill">Fill this page</button>
    <label class="chk"><input type="checkbox" id="overwrite"> overwrite</label>
  </div>

  <div id="report"></div>

  <details>
    <summary>Teach unmatched fields</summary>
    <div id="teach"></div>
    <button id="scan">Scan page</button>
    <button id="copymap">Copy page map</button>
  </details>

  <details>
    <summary>Load a record manually</summary>
    <textarea id="json" placeholder="Paste the JSON copied from the worksheet"></textarea>
    <button id="load">Load</button>
  </details>

  <script src="../normalize.js"></script>
  <script src="matcher.js"></script>
  <script src="popup.js"></script>
</body>
</html>
